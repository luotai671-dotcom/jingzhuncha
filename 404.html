  <meta charset="UTF-8">

  <meta name="description" content="抱歉，您访问的页面不存在或已被移除。请返回机场精准查首页查看最新优质机场推荐与独立实测档案。">
  <meta name="robots" content="noindex,follow">
  <title>页面未找到 - 404｜机场精准查</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="page.css">
  <script>
    (function() {
      var p = location.pathname.toLowerCase();
      var s = location.search;
      var q = new URLSearchParams(s);

      // 常见一级频道 Clean URL 映射
      if (p === '/reviews' || p === '/reviews/') { location.replace('reviews.html' + s); return; }
      if (p === '/compare' || p === '/compare/') { location.replace('compare.html' + s); return; }
      if (p === '/library' || p === '/library/') { location.replace('library.html' + s); return; }
      if (p === '/recommend' || p === '/recommend/') { location.replace('recommend.html' + s); return; }
      if (p === '/bonus' || p === '/bonus/') { location.replace('bonus.html' + s); return; }
      if (p === '/about' || p === '/about/') { location.replace('about.html' + s); return; }
      if (p === '/help' || p === '/help/') { location.replace('help.html' + s); return; }
      if (p === '/warning' || p === '/warning/') { location.replace('warning.html' + s); return; }

      // 302 隔离 /go/ 内部跳转路由映射
      var goMap = {
        'shandianshu': 'https://chenpin.shandianshuaff.com/#/?code=m28TvPVX',
        'dalaoyun': 'https://chenpin01.dalaoyunaff.com/#/?code=GQ6CL6Km',
        'huanqiuti': 'https://chenpingan01.huanqiutiaff.com/#/?code=FGCcYdFo',
        'liulianyun': 'https://chenpingan.liulianyunaff.com/#/?code=7pdjs9zt',
        'yunjiexian': 'https://chenpinga.yunjiexianaff.com/#/?code=rTCMGvQT',
        'shenxing': 'https://chenpingan01.shenxingaff.com/#/?code=RZ48f9wP',
        'ermaoyun': 'https://server.ermaotztz3.homes/#/?code=Vf45aB7S',
        'guangsuyun': 'https://sjds8ds.guangsut.sbs/#/?code=RrfZcKT5',
        'bianyuan': 'https://bcbhk40y.ztymforedge.lol/#/?code=HgD5cJEh'
      };
      var goMatch = p.match(/^\/go\/([a-z0-9_-]+)/);
      if (goMatch && goMap[goMatch[1]]) {
        location.replace(goMap[goMatch[1]]);
        return;
      }

      // /articles/ 无后缀 clean URL 自动映射至 .html
      if (p.startsWith('/articles/')) {
        var slug = p.replace(/^\/articles\//, '').replace(/\/$/, '');
        if (!slug.endsWith('.html')) {
          location.replace('articles/' + slug + '.html' + s);
          return;
        }
      }

      // 传统文章 ID 与机场参数兼容
      var postId = q.get('id') || q.get('post') || q.get('articleId');
      if (p.includes('/article') || p.includes('/post') || p.includes('/library')) {
        location.replace('library.html' + (postId ? '?id=' + postId : ''));
      } else if (p.includes('/airport')) {
        var airportId = q.get('id') || q.get('name');
        location.replace('airport.html' + (airportId ? '?id=' + airportId : ''));
      }
    })();
  </script>
</head>
